services:
  - type: web
    name: crypto-verifier
    env: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PORT
        value: 3000
      - key: APP_URL
        sync: false
      - key: MASTER_MNEMONIC
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_ADMIN_CHAT_ID
        sync: false
      - key: TELEBIRR_PHONE
        value: "09XXXXXXXX"
      - key: CBE_ACCOUNT
        value: "1000XXXXXXXXX"
      - key: MERCHANT_NAME
        value: "Merchant"
      - key: USDT_TO_ETB_RATE
        value: "130"
      - key: POLYGON_RPC_URL
        value: https://polygon-bor-rpc.publicnode.com
      - key: BSC_RPC_URL
        value: https://bsc-rpc.publicnode.com
      - key: WATCHER_INTERVAL_SECONDS
        value: 10
